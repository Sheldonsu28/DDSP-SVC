data:
  block_size: 512
  cnhubertsoft_gate: 10
  duration: 0.65
  encoder: contentvec768l12tta2x
  encoder_ckpt: pretrain/contentvec/checkpoint_best_legacy_500.pt
  encoder_hop_size: 160
  encoder_out_channels: 768
  encoder_sample_rate: 16000
  extensions:
  - wav
  f0_extractor: rmvpe
  f0_max: 1060
  f0_min: 65
  sampling_rate: 44100
  train_path: data/train
  valid_path: data/val
  volume_smooth_size: 256
device: cuda
env:
  expdir: exp/reflow-test
  gpu_id: 0
  style_dir: exp/reflow-style-test
  style_enhance_dir: exp/post_processor
  style_flow_dir: exp/reflow-vc-style-test
infer:
  infer_step: 50
  method: euler
model:
  kernel_size: 31
  n_aux_chans: 1024
  n_aux_layers: 10
  n_chans: 2048
  n_layers: 10
  n_spk: 1
  t_start: 0.0
  type: RectifiedFlow
  use_attention: true
  use_norm: true
  use_pitch_aug: true
  win_length: 2048
train:
  amp_dtype: bf16
  batch_size: 24
  cache_all_data: true
  cache_device: cpu
  cache_fp16: false
  decay_step: 250
  epochs: 1000000
  gamma: 0.98
  interval_force_save: 500
  interval_log: 50
  interval_val: 500
  lambda_ddsp: 1
  lr: 0.00015
  num_workers: 4
  save_opt: false
  weight_decay: 0.1
vocoder:
  ckpt: pretrain/nsf_hifigan/nsf_ely_4000.ckpt
  type: nsf-hifigan
